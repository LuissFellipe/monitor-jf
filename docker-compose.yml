services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      retries: 10

  coletor:
    build: ./coletor
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      HORAS_EXECUCAO: "7,19"
      CONFIG_LOCAIS: /config/config.toml
      TZ: America/Sao_Paulo
    volumes:
      - ./config.toml:/config/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@postgres:5432/monitor
      CONFIG_LOCAIS: /config/config.toml
      TZ: America/Sao_Paulo
    volumes:
      - ./config.toml:/config/config.toml:ro
    ports:
      - "8502:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
